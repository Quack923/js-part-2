<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div id="name">Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div id="name">Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
   const nameInput = document.querySelector(".add-form-name");
  const commentInput = document.querySelector(".add-form-text");
  const addButton = document.querySelector(".add-form-button");
  const commentsList = document.querySelector(".comments");

  const comments = [
    {
      name: "Глеб Фокин",
      date: "12.02.22 12:18",
      text: "Это будет первый комментарий на этой странице",
      likesCount: 3,
      isLiked: false,
    },
    {
      name: "Варвара Н.",
      date: "13.02.22 19:22",
      text: "Мне нравится как оформлена эта страница! ❤",
      likesCount: 75,
      isLiked: true,
    },
  ];

  const clearHtml = (htmlString) => {
    return htmlString
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  };

  const initEventListeners = () => {
    const likeButtons = document.querySelectorAll(".like-button");
    const replyButtons = document.querySelectorAll(".reply-button");

    for (const likeButton of likeButtons) {
      likeButton.onclick = (event) => {
        event.stopPropagation();
        const index = likeButton.dataset.index;
        const comment = comments[index];

        if (comment.isLiked) {
          comment.likesCount -= 1;
        } else {
          comment.likesCount += 1;
        }
        comment.isLiked = !comment.isLiked;

        renderComments();
      };
    }

    for (const replyButton of replyButtons) {
      replyButton.onclick = () => {
        const index = replyButton.dataset.index;
        const comment = comments[index];

        commentInput.value = `Ответ для ${comment.name}\n про \n${comment.text},  `;
        commentInput.focus();
      };
    }
  };

  const renderComments = () => {
    const commentsHtml = comments.map((comment, index) => {
      return `<li class="comment">
        <div class="comment-header">
          <div>${clearHtml(comment.name)}</div>
          <div>${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text" style="white-space: pre-line;">
            ${clearHtml(comment.text)}
          </div>
        </div>
        <div class="comment-footer">
          <button class="reply-button" data-index="${index}">Ответить</button>
          <div class="likes">
            <span class="likes-counter">${comment.likesCount}</span>
            <button class="like-button ${comment.isLiked ? '-active-like' : ''}" data-index="${index}"></button>
          </div>
        </div>
      </li>`;
    }).join("");

    commentsList.innerHTML = commentsHtml;
    initEventListeners();
  };

  
  addButton.addEventListener("click", () => {
    
    if (nameInput.value.trim() === "" || commentInput.value.trim() === "") {
      alert("Ошибка: Вы не ввели данные!");
      return;
    }

    const now = new Date();
    const dateTime = now.toLocaleString().slice(0, -3);

    
    comments.push({
      name: nameInput.value,
      date: dateTime,
      text: commentInput.value,
      likesCount: 0,
      isLiked: false,
    });

    
    nameInput.value = "";
    commentInput.value = "";

    renderComments();
  });

  
  renderComments();
</script>

</script>
  </script>
</html>
